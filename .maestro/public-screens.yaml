appId: com.daniil.chatstudio
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Чат Анна Миронова'
    timeout: 30000
- takeScreenshot: chats
- tapOn: 'Чат Анна Миронова'
- assertVisible: 'Сообщение.*'
- takeScreenshot: dialogue
- tapOn: 'Сообщение.*'
- inputText: 'First line'
- pressKey: enter
- inputText: 'Second line'
- assertVisible: '.*Second line.*'
- takeScreenshot: keyboard
- eraseText
- inputText: 'Проверка длинного сообщения: строки должны использовать всю доступную ширину пузыря. Время и галочки не должны сдвигать слова или перекрывать текст.'
- tapOn: 'Отправить сообщение'
- assertVisible: '.*Проверка длинного сообщения.*'
- takeScreenshot: text-wrapping
- tapOn: 'Сообщение.*'
- inputText: 'First line'
- pressKey: enter
- inputText: 'Second line'
- tapOn: 'Отправить сообщение'
- assertVisible: '.*Second line.*'
- takeScreenshot: explicit-newlines
- hideKeyboard
- tapOn: 'Открыть профиль'
- assertVisible: 'звонок'
- takeScreenshot: profile
- tapOn: 'Назад'
- assertVisible: 'Сообщение.*'
- tapOn: 'Назад к чатам'
- tapOn: 'Контакты'
- assertVisible: 'Пригласить друзей'
- takeScreenshot: contacts
- tapOn: 'Настройки'
- assertVisible: 'Установить фотографию'
- takeScreenshot: settings
- tapOn: 'Звонки'
- assertVisible: 'Позвонить'
- takeScreenshot: calls
