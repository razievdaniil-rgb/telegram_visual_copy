name: iOS Simulator visual verification
on:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_VISUAL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Select and boot an iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("/tmp/devices.json")); a=[x for v in d["devices"].values() for x in v]; p=next((x for x in a if x["name"] in ["iPhone 17 Pro", "iPhone 16 Pro"]),next(x for x in a if x["name"].startswith("iPhone"))); print(p["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Build for Simulator
        run: xcodebuild -workspace ios/ChatStudio.xcworkspace -scheme ChatStudio -configuration Release -sdk iphonesimulator -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > /tmp/simulator-build.log 2>&1 || { tail -n 150 /tmp/simulator-build.log; exit 1; }
      - name: Install and capture public screens
        run: |
          mkdir -p artifacts/ios-simulator
          xcrun simctl install "$DEVICE" build/Build/Products/Release-iphonesimulator/ChatStudio.app
          xcrun simctl launch "$DEVICE" com.daniil.chatstudio
          sleep 5
          xcrun simctl io "$DEVICE" screenshot artifacts/ios-simulator/chats.png
          for ENTRY in 'chat/example-chat-anna:dialogue' 'profile/example-anna?chatId=example-chat-anna:profile' 'contacts:contacts' 'settings:settings' 'calls:calls'; do
            ROUTE=${ENTRY%:*}
            NAME=${ENTRY##*:}
            xcrun simctl openurl "$DEVICE" "chatstudio:///$ROUTE"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "artifacts/ios-simulator/$NAME.png"
          done
          xcrun simctl list devices available -j > artifacts/ios-simulator/devices.json
          cp /tmp/simulator-build.log artifacts/ios-simulator/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatStudio-ios-simulator
          path: artifacts/ios-simulator
          if-no-files-found: warn
