name: Native Telegram - requirements audit
on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Run containing Native-Telegram-simulator-app
        type: string
        required: true
      scenarios:
        description: JSON list of scenario names
        type: string
        default: '["public","editor","messages","status"]'
      probe_decoder:
        description: Optional standalone decoder diagnostic, not part of app acceptance
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['native/qa-request.json']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      app_run: ${{ steps.resolve.outputs.app_run }}
      scenarios: ${{ steps.resolve.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          INPUT_RUN: ${{ inputs.app_run_id }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          python3 native/scripts/validate_qa.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('native/qa-request.json').read_text()) if Path('native/qa-request.json').exists() else {}
          app_run = os.environ.get('INPUT_RUN') or request['app_run_id']
          scenarios = json.loads(os.environ['INPUT_SCENARIOS']) if os.environ.get('INPUT_SCENARIOS') else request['scenarios']
          assert str(app_run).isdigit()
          assert scenarios and set(scenarios) <= {'public', 'editor', 'messages', 'status', 'avatar', 'time', 'compose', 'suite', 'presentation', 'menu', 'release', 'delivery-tail', 'handoff', 'fresh', 'gear', 'wallpaper'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'app_run={app_run}\nscenarios={json.dumps(scenarios)}\n')
          PY
  check:
    needs: plan
    concurrency:
      group: native-qa-${{ matrix.scenario }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 70
    strategy:
      fail-fast: false
      # Keep capture independent from another booting/recording simulator.
      max-parallel: 1
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONUNBUFFERED: '1'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Native-Telegram-simulator-app
          run-id: ${{ needs.plan.outputs.app_run }}
          github-token: ${{ github.token }}
          path: artifacts/native-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pinned screenshot verifier dependency
        if: matrix.scenario == 'release' || matrix.scenario == 'handoff' || matrix.scenario == 'gear' || matrix.scenario == 'wallpaper'
        run: python3 -m pip install Pillow==11.3.0
      - name: Install official pinned Maestro CLI
        run: |
          curl -fLsS https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          MAESTRO_BIN=$(find "$RUNNER_TEMP/maestro-cli" -type f -path '*/bin/maestro' -print -quit)
          chmod +x "$MAESTRO_BIN"
          dirname "$MAESTRO_BIN" >> "$GITHUB_PATH"
      - name: Install on a fresh dedicated iPhone with synthetic data
        id: install
        timeout-minutes: 12
        run: |
          set -x
          mkdir -p artifacts/native-demo
          sw_vers > artifacts/native-demo/environment.txt
          xcodebuild -version >> artifacts/native-demo/environment.txt
          python3 native/scripts/verify_ipa.py artifacts/native-build/Telegram.ipa --platform simulator --output artifacts/native-demo/verification.json
          if [ '${{ matrix.scenario }}' = wallpaper ] || [ '${{ matrix.scenario }}' = release ]; then
            python3 native/scripts/verify_wallpaper_bundle.py artifacts/native-build/Telegram.ipa --output artifacts/native-demo/wallpaper-resources.json
            python3 native/scripts/verify_settings_default.py artifacts/native-build/Telegram.ipa --expected gear --output artifacts/native-demo/settings-default.json
          fi
          cp artifacts/native-build/app-source-sha.txt artifacts/native-demo/
          xcrun simctl list -j > artifacts/native-demo/simulators.json
          python3 native/scripts/create_demo_device.py
          DEVICE=$(cat artifacts/native-demo/device-udid.txt)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          unzip -q artifacts/native-build/Telegram.ipa -d artifacts/native-demo-app
          xcrun simctl install "$DEVICE" artifacts/native-demo-app/Payload/Telegram.app
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" org.chatstudio.localsimulator data)
          if [ '${{ matrix.scenario }}' != fresh ]; then
            python3 native/scripts/seed_demo.py "$CONTAINER"
          fi
      - name: Prepare Photos for a standalone media scenario
        if: (matrix.scenario == 'avatar' || matrix.scenario == 'presentation' || matrix.scenario == 'handoff') && steps.install.outcome == 'success'
        timeout-minutes: 9
        run: |
          python3 native/scripts/record_scenario.py native/qa-photos-setup.yaml --timeout 180
          python3 native/scripts/import_demo_photo.py
      - name: Probe the exact compiled native wallpaper decoder
        if: matrix.scenario == 'wallpaper' && inputs.probe_decoder
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p artifacts/native-demo/pattern-probe
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          Path('artifacts/native-demo/pattern-probe/input.svg').write_bytes(gzip.decompress(Path('native/Resources/SimulatorDefaultPattern.tgv').read_bytes()))
          PY
          FRAMEWORKS="$GITHUB_WORKSPACE/artifacts/native-demo-app/Payload/Telegram.app/Frameworks"
          xcrun --sdk iphonesimulator clang -arch arm64 -mios-simulator-version-min=15.0 -fobjc-arc -framework Foundation -framework UIKit -Wl,-rpath,"$FRAMEWORKS" native/scripts/probe_wallpaper.m -o "$RUNNER_TEMP/pattern-probe"
          codesign --force --sign - "$RUNNER_TEMP/pattern-probe"
          xcrun simctl spawn "$DEVICE" "$RUNNER_TEMP/pattern-probe" "$FRAMEWORKS/TelegramUIFramework.framework/TelegramUIFramework" "$GITHUB_WORKSPACE/artifacts/native-demo/pattern-probe/input.svg" "$GITHUB_WORKSPACE/artifacts/native-demo/pattern-probe"
      - name: Check ${{ matrix.scenario }} and record actual frames
        id: scenario_capture
        if: matrix.scenario != 'release' && matrix.scenario != 'delivery-tail'
        timeout-minutes: 34
        run: |
          LIMIT=600
          if [ '${{ matrix.scenario }}' = suite ] || [ '${{ matrix.scenario }}' = presentation ]; then LIMIT=900; fi
          if [ '${{ matrix.scenario }}' = handoff ]; then LIMIT=1020; fi
          if [ '${{ matrix.scenario }}' = wallpaper ]; then LIMIT=900; fi
          python3 native/scripts/record_scenario.py 'native/qa-${{ matrix.scenario }}.yaml' --timeout "$LIMIT"
      - name: Verify actual avatar to gear mode changes
        if: matrix.scenario == 'gear' && steps.scenario_capture.outcome == 'success'
        run: python3 native/scripts/verify_settings_icons.py artifacts/native-demo/qa-gear
      - name: Verify native wallpaper detail and persistence from screenshots
        if: matrix.scenario == 'wallpaper' && steps.scenario_capture.outcome == 'success'
        run: python3 native/scripts/verify_wallpaper_frames.py artifacts/native-demo/qa-wallpaper
      - name: Verify handoff short-list positions from actual screenshots
        if: matrix.scenario == 'handoff' && steps.scenario_capture.outcome == 'success'
        run: python3 native/scripts/verify_menu_frames.py artifacts/native-demo/qa-handoff
      - name: Record release menu chapter
        id: menu_capture
        if: ${{ !cancelled() && matrix.scenario == 'release' && steps.install.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 native/scripts/record_scenario.py native/qa-menu.yaml --timeout 600
      - name: Initialize Photos and import the synthetic fixture for remaining chapters
        id: tail_photo
        if: matrix.scenario == 'delivery-tail' && steps.install.outcome == 'success'
        timeout-minutes: 9
        run: |
          python3 native/scripts/record_scenario.py native/qa-photos-setup.yaml --timeout 180
          python3 native/scripts/import_demo_photo.py
      - name: Verify short-list avatar positions in recorded menu frames
        id: menu_geometry
        if: matrix.scenario == 'release' && steps.menu_capture.outcome == 'success'
        run: python3 native/scripts/verify_menu_frames.py artifacts/native-demo/qa-menu
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scenario == 'release'
        with:
          name: Native-QA-release-menu
          path: |
            artifacts/native-demo/app-source-sha.txt
            artifacts/native-demo/verification.json
            artifacts/native-demo/qa-menu/
          retention-days: 7
      - name: Record release wallpaper and persistence chapter
        id: wallpaper_capture
        if: ${{ !cancelled() && matrix.scenario == 'release' && steps.menu_geometry.outcome == 'success' }}
        timeout-minutes: 18
        run: python3 native/scripts/record_scenario.py native/qa-wallpaper.yaml --timeout 900
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scenario == 'release'
        with:
          name: Native-QA-release-wallpaper
          path: |
            artifacts/native-demo/app-source-sha.txt
            artifacts/native-demo/verification.json
            artifacts/native-demo/qa-wallpaper/
          retention-days: 7
      - name: Add the avatar fixture after the simulator has warmed up
        id: release_photo
        if: ${{ !cancelled() && matrix.scenario == 'release' && steps.wallpaper_capture.outcome == 'success' }}
        timeout-minutes: 9
        run: |
          python3 native/scripts/record_scenario.py native/qa-photos-setup.yaml --timeout 180
          python3 native/scripts/import_demo_photo.py
      - name: Verify release wallpaper detail and persisted palette
        if: matrix.scenario == 'release' && steps.wallpaper_capture.outcome == 'success'
        run: python3 native/scripts/verify_wallpaper_frames.py artifacts/native-demo/qa-wallpaper
      - name: Record release avatar replacement chapter
        id: avatar_capture
        if: ${{ !cancelled() && ((matrix.scenario == 'release' && steps.release_photo.outcome == 'success') || (matrix.scenario == 'delivery-tail' && steps.tail_photo.outcome == 'success')) }}
        timeout-minutes: 12
        run: python3 native/scripts/record_scenario.py native/qa-avatar.yaml --timeout 600
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.scenario == 'release' || matrix.scenario == 'delivery-tail')
        with:
          name: Native-QA-release-avatar
          path: |
            artifacts/native-demo/app-source-sha.txt
            artifacts/native-demo/verification.json
            artifacts/native-demo/qa-avatar/
          retention-days: 7
      - name: Record release functionality chapter
        if: ${{ !cancelled() && (matrix.scenario == 'release' || matrix.scenario == 'delivery-tail') && steps.avatar_capture.outcome == 'success' }}
        timeout-minutes: 20
        run: python3 native/scripts/record_scenario.py native/qa-presentation.yaml --timeout 1020
      - name: Collect synthetic wallpaper cache diagnostics
        if: always() && (matrix.scenario == 'wallpaper' || matrix.scenario == 'release') && steps.install.outcome == 'success'
        timeout-minutes: 2
        run: |
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" org.chatstudio.localsimulator data)
          python3 - "$CONTAINER" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          records=[]
          for p in root.rglob('*5789658100176783156*'):
              if p.is_file():
                  records.append(dict(path=str(p.relative_to(root)), bytes=p.stat().st_size, sha256=hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()))
          Path('artifacts/native-demo/wallpaper-cache.json').write_text(json.dumps(records, indent=2)+'\n')
          print(json.dumps(records, indent=2))
          PY
      - name: Collect native crash reports
        if: always()
        run: |
          mkdir -p artifacts/native-demo/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'Telegram*' -exec cp {} artifacts/native-demo/crashes/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-QA-${{ matrix.scenario }}
          path: artifacts/native-demo/
          retention-days: 7
      - name: Shut down only the dedicated test simulator
        if: always() && env.DEVICE != ''
        run: xcrun simctl shutdown "$DEVICE" || true
