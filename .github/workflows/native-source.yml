name: Native Swift sources
on:
  push:
    paths: ['native/**', '.github/workflows/native-source.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-source.yml']
  workflow_dispatch:
jobs:
  model-and-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test the portable Swift data model
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace swift:6.0 swift test --package-path native
      - name: Parse native integration and editor sources (not an iOS typecheck)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace swift:6.0 bash -c 'swiftc -frontend -parse native/Sources/Core/*.swift native/Sources/UI/*.swift'
      - uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: fb0e62ba8a147f0821da6aa63c09da7d79a10111
          path: artifacts/native-ci-upstream
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build-system/Make/Make.py
            /submodules/Svg/LegacyImpl/Sources/nanosvg.c
            /submodules/Svg/LegacyImpl/Sources/nanosvg.h
            /submodules/TelegramCore/Sources/Account/Account.swift
            /submodules/TelegramCore/Sources/State/AccountStateManager.swift
            /submodules/TelegramCore/Sources/Network/Network.swift
            /submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift
            /submodules/TelegramCore/Sources/PendingMessages/RequestEditMessage.swift
            /submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessagesInteractively.swift
            /submodules/TelegramCore/Sources/TelegramEngine/Messages/TelegramEngineMessages.swift
            /submodules/TelegramCore/Sources/Wallpapers.swift
            /submodules/TelegramCore/Sources/TelegramEngine/Themes/ChatThemes.swift
            /submodules/TelegramUI/Sources/AppDelegate.swift
            /submodules/TelegramUI/Sources/ApplicationContext.swift
            /submodules/TelegramUI/Sources/TelegramRootController.swift
            /submodules/TelegramUI/Sources/WallpaperUploadManager.swift
            /submodules/TelegramUI/Components/Settings/WallpaperGridScreen/Sources/WallpaperUtils.swift
            /submodules/TelegramUI/Sources/Chat/ChatControllerOpenMessageContextMenu.swift
            /submodules/TelegramUI/Sources/Chat/ChatControllerLoadDisplayNode.swift
            /submodules/TelegramUI/Components/Chat/ChatMessageItemImpl/Sources/ChatMessageItemImpl.swift
            /submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoProfileItems.swift
            /submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift
            /submodules/TelegramUI/Components/Chat/ChatMessageBubbleContentNode/Sources/ChatMessageBubbleContentNode.swift
            /submodules/ChatListUI/Sources/Node/ChatListItem.swift
            /submodules/ChatListUI/Sources/ChatListController.swift
            /submodules/ChatListUI/Sources/ChatListControllerNode.swift
            /submodules/ChatListUI/Sources/ChatListContainerItemNode.swift
            /submodules/ChatListUI/Sources/ChatListSearchListPaneNode.swift
      - uses: actions/checkout@v4
        with:
          repository: ali-fareed/rules_apple
          ref: 485016eb5b0948cc17307064e7977a6d68e94046
          path: artifacts/native-ci-upstream/build-system/bazel-rules/rules_apple
          sparse-checkout-cone-mode: false
          sparse-checkout: /apple/internal/ios_rules.bzl
      - name: Check the bundled vector with the pinned native NanoSVG parser
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          Path('/tmp/simulator-pattern.svg').write_bytes(gzip.decompress(Path('native/Resources/SimulatorDefaultPattern.tgv').read_bytes()))
          PY
          SVG=artifacts/native-ci-upstream/submodules/Svg/LegacyImpl/Sources
          cc -O2 -I "$SVG" native/scripts/check_pattern.c "$SVG/nanosvg.c" -lm -o /tmp/check-pattern
          mkdir -p artifacts/native-pattern
          timeout 20s /tmp/check-pattern /tmp/simulator-pattern.svg artifacts/native-pattern/SimulatorDefaultPattern.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Native-Prepared-Wallpaper
          path: artifacts/native-pattern/SimulatorDefaultPattern.bin
          retention-days: 7
      - name: Verify the committed prepared vector matches its source
        run: |
          if [ -f native/Resources/SimulatorDefaultPattern.bin ]; then cmp native/Resources/SimulatorDefaultPattern.bin artifacts/native-pattern/SimulatorDefaultPattern.bin; fi
      - name: Apply the native patch and verify reproducibility
        run: |
          python3 native/scripts/prepare.py --checkout artifacts/native-ci-upstream
          python3 native/scripts/prepare.py --checkout artifacts/native-ci-upstream
          python3 native/scripts/prepare.py --checkout artifacts/native-ci-upstream --check
          python3 native/scripts/test_preparation.py --checkout artifacts/native-ci-upstream
      - name: Package source kit (not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Native-Source-Kit
          path: |
            native/Sources/
            native/Resources/
            native/scripts/
            native/patches/
            native/vendor-patches/
            native/upstream.json
            native/configuration.simulator.json
            native/README.md
            native/COMPONENT_MAP.md
            native/CLOUD_BUILD.md
            native/INSTALL_WINDOWS.md
            native/Package.swift
            native/Tests/
