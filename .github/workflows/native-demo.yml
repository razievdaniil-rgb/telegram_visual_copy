name: Native Telegram - simulator video
on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Reuse Native-Telegram-simulator-app from this run (no recompilation)
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['native/demo-request.json', '.github/workflows/native-demo.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-telegram-demo
  cancel-in-progress: true
jobs:
  demo:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONUNBUFFERED: '1'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve reusable simulator build
        run: |
          mkdir -p artifacts/native-demo
          REQUEST_RUN=$(python3 -c 'import json; print(json.load(open("native/demo-request.json"))["simulator_app_run_id"])')
          APP_RUN='${{ inputs.app_run_id }}'
          echo "APP_RUN=${APP_RUN:-$REQUEST_RUN}" >> "$GITHUB_ENV"
          sw_vers > artifacts/native-demo/environment.txt
          xcodebuild -version >> artifacts/native-demo/environment.txt
      - name: Prepare the original pinned source
        if: env.APP_RUN == ''
        run: |
          set -o pipefail
          python3 native/scripts/prepare.py --full 2>&1 | tee artifacts/native-demo/prepare.log
      - uses: actions/cache/restore@v4
        if: env.APP_RUN == ''
        id: native-cache
        with:
          path: ~/telegram-bazel-cache
          key: telegram-native-xcode27.1-arm64-simulator-${{ hashFiles('native/upstream.json', 'native/patches/*.patch', 'native/Sources/**/*.swift') }}-${{ github.run_id }}
          restore-keys: |
            telegram-native-xcode27.1-arm64-simulator-
            telegram-native-xcode27.1-arm64-
      - name: Compile native Telegram for the simulator
        if: env.APP_RUN == ''
        run: |
          set -o pipefail
          python3 native/scripts/build.py build-simulator --build-number '${{ github.run_number }}' 2>&1 | tee artifacts/native-demo/compile.log
          python3 native/scripts/verify_ipa.py artifacts/native-build/Telegram.ipa --platform simulator --output artifacts/native-build/verification.json
          git rev-parse HEAD > artifacts/native-build/app-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: env.APP_RUN == '' && success()
        with:
          name: Native-Telegram-simulator-app
          path: |
            artifacts/native-build/Telegram.ipa
            artifacts/native-build/verification.json
            artifacts/native-build/app-source-sha.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: env.APP_RUN != ''
        with:
          name: Native-Telegram-simulator-app
          run-id: ${{ env.APP_RUN }}
          github-token: ${{ github.token }}
          path: artifacts/native-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pinned Maestro CLI
        run: |
          curl -fLsS https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          MAESTRO_BIN=$(find "$RUNNER_TEMP/maestro-cli" -type f -path '*/bin/maestro' -print -quit)
          chmod +x "$MAESTRO_BIN"
          dirname "$MAESTRO_BIN" >> "$GITHUB_PATH"
      - name: Create a dedicated iPhone and install the simulator app
        run: |
          python3 native/scripts/verify_ipa.py artifacts/native-build/Telegram.ipa --platform simulator --output artifacts/native-demo/verification.json
          cp artifacts/native-build/app-source-sha.txt artifacts/native-demo/
          xcrun simctl list -j > artifacts/native-demo/simulators.json
          python3 - <<'PY'
          import json, os, subprocess
          d=json.load(open('artifacts/native-demo/simulators.json'))
          runtime=next(r['identifier'] for r in d['runtimes'] if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-'))
          phones=[t for t in d['devicetypes'] if t['name'].startswith('iPhone')]
          phone=next((t for t in phones if t['name']=='iPhone 18 Pro'), phones[-1])
          udid=subprocess.check_output(['xcrun','simctl','create','Native Telegram Demo',phone['identifier'],runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVICE='+udid+'\n')
          PY
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
          unzip -q artifacts/native-build/Telegram.ipa -d artifacts/native-demo-app
          xcrun simctl install "$DEVICE" artifacts/native-demo-app/Payload/Telegram.app
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" org.chatstudio.localsimulator data)
          python3 native/scripts/seed_demo.py "$CONTAINER"
      - name: Record actual native screens and hidden editor
        run: |
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force artifacts/native-demo/native-telegram.mp4 > artifacts/native-demo/recording.log 2>&1 &
          REC=$!
          trap 'kill -INT "$REC" 2>/dev/null || true; wait "$REC" || true' EXIT
          for i in $(seq 1 100); do
            if grep -q 'Recording started' artifacts/native-demo/recording.log; then break; fi
            sleep 0.1
          done
          maestro --device "$DEVICE" test --test-output-dir artifacts/native-demo/maestro native/demo.yaml
          sleep 2
      - name: Collect last screen and native crash reports
        if: always() && env.DEVICE != ''
        run: |
          xcrun simctl io "$DEVICE" screenshot artifacts/native-demo/last-screen.png || true
          mkdir -p artifacts/native-demo/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'Telegram*' -exec cp {} artifacts/native-demo/crashes/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Telegram-video-and-screens
          path: artifacts/native-demo/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && env.APP_RUN == ''
        continue-on-error: true
        with:
          path: ~/telegram-bazel-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
