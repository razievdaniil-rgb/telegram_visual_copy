appId: org.chatstudio.localsimulator
---
- launchApp
- extendedWaitUntil:
    visible: '[\s\S]*Анна[\s\S]*'
    timeout: 90000
- takeScreenshot: artifacts/native-demo/chats
- tapOn: '[\s\S]*Анна[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*Отлично, покажи[\s\S]*'
    timeout: 30000
- takeScreenshot: artifacts/native-demo/dialogue
- tapOn:
    point: '50%, 9%'
- waitForAnimationToEnd
- takeScreenshot: artifacts/native-demo/profile
- tapOn:
    point: '8%, 9%'
- waitForAnimationToEnd
- tapOn:
    point: '8%, 9%'
- waitForAnimationToEnd
- longPressOn:
    point: '50%, 9%'
- extendedWaitUntil:
    visible: 'Редактор'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/editor
- tapOn:
    text: '[\s\S]*Анна[\s\S]*'
    index: 0
- takeScreenshot: artifacts/native-demo/editor-profile
