appId: org.chatstudio.localsimulator
---
# One continuous story on a single installed binary and a single document.
# Chapter screenshots identify edit boundaries; gestures and typing stay at 1x.
- runFlow: qa-root.yaml
- takeScreenshot: artifacts/native-demo/film-01-chats
- tapOn: '[\s\S]*Анна Миронова[\s\S]*'
- takeScreenshot: artifacts/native-demo/film-02-dialogue
- tapOn:
    point: '45%, 95%'
- tapOn:
    text: 'Continue|Продолжить'
    optional: true
- inputText: 'Привет! Показываю прототип.'
- tapOn: 'Отправить'
- extendedWaitUntil:
    # Telegram keeps a 1x1 Send accessibility node after hiding its button.
    visible: 'Голосовое сообщение'
    timeout: 10000
- assertVisible: '[\s\S]*Привет! Показываю прототип\.[\s\S]*'
- takeScreenshot: artifacts/native-demo/film-03-sent
- longPressOn: '[\s\S]*Привет! Показываю прототип\.[\s\S]*'
- assertVisible: 'Скопировать|Копировать|Copy'
- assertNotVisible: '[\s\S]*Чтобы копировать[\s\S]*'
- tapOn: 'Скопировать|Копировать|Copy'
- longPressOn: '[\s\S]*Привет! Показываю прототип\.[\s\S]*'
- tapOn: 'Выбрать|Select'
- extendedWaitUntil:
    visible: 'Отмена'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/film-03b-selected
- tapOn: 'Отмена'
- longPressOn: '[\s\S]*Привет! Показываю прототип\.[\s\S]*'
- assertVisible: 'Изменить'
- assertNotVisible: '[\s\S]*Чтобы копировать[\s\S]*'
- takeScreenshot: artifacts/native-demo/film-04-message-menu
- tapOn: 'Изменить'
- eraseText
- inputText: 'Привет! Прототип уже работает.'
- tapOn: 'Отправить'
- extendedWaitUntil:
    visible: '[\s\S]*Привет! Прототип уже работает\.[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/film-05-public-edit
- tapOn:
    point: '8%, 9%'
- longPressOn:
    point: '27%, 6%'
- extendedWaitUntil:
    visible: 'Редактор'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/film-06-hidden-editor
- tapOn: 'Добавить собеседника'
- tapOn:
    id: 'simulator.profile.field.0'
- inputText: 'Елена'
- tapOn:
    id: 'simulator.profile.field.1'
- inputText: 'Смирнова'
- tapOn:
    id: 'simulator.profile.field.2'
- inputText: 'elena_demo'
- tapOn:
    id: 'simulator.profile.field.3'
- inputText: '+79990000003'
- tapOn:
    id: 'simulator.profile.field.4'
- inputText: 'Виртуальный собеседник'
- takeScreenshot: artifacts/native-demo/film-07-profile-fields
- tapOn: 'Выбрать аватар'
- tapOn:
    text: 'Allow Full Access|Allow Access to All Photos|Разрешить полный доступ|Разрешить доступ ко всем фото'
    optional: true
- tapOn:
    text: 'Recents|Недавние'
    optional: true
- tapOn:
    point: '16%, 28%'
- takeScreenshot: artifacts/native-demo/film-08-avatar-crop
- tapOn:
    # UIImagePicker's crop actions are drawn but absent from the AX tree on
    # this simulator. Confirm the visible bottom-right Choose button.
    point: '90%, 92%'
- extendedWaitUntil:
    visible: 'Сохранить'
    timeout: 10000
- tapOn: 'Сохранить'
- tapOn: 'Создать чат'
- tapOn: '[\s\S]*Елена Смирнова[\s\S]*'
- tapOn:
    id: 'simulator.section.2.row.2'
- tapOn: 'Сообщение'
- tapOn: 'Текст сообщения'
- inputText: 'Встречаемся в 18:00?'
- tapOn: 'Исходящее'
- tapOn: 'Одна галочка'
- tapOn: 'Oct [0-9]{1,2}, 2026'
- tapOn: '15|[\s\S]*October 15[\s\S]*'
- tapOn:
    point: '3%, 20%'
- takeScreenshot: artifacts/native-demo/film-09-manual-date
- tapOn: '[0-9]{1,2}:[0-9]{2}[\s\S]*(AM|PM)'
- tapOn:
    point: '63%, 38%'
- eraseText: 2
- inputText: '45'
- tapOn:
    point: '3%, 20%'
- tapOn: '[0-9]{1,2}:[0-9]{2}[\s\S]*(AM|PM)'
- tapOn:
    point: '48%, 35%'
- tapOn:
    point: '3%, 20%'
- takeScreenshot: artifacts/native-demo/film-10-manual-time
- tapOn: 'Сохранить'
- assertVisible: '[\s\S]*2026-10-15T[\s\S]*'
- tapOn: 'Сообщение'
- tapOn: 'Текст сообщения'
- inputText: 'Да, договорились!'
- tapOn: 'Входящее'
- tapOn: 'Сохранить'
- takeScreenshot: artifacts/native-demo/film-11-both-sides
- tapOn: '[\s\S]*Встречаемся в 18:00\?[\s\S]*'
- tapOn: 'Текст сообщения'
- eraseText
- inputText: 'Встречаемся в 18:30?'
- tapOn: 'Две галочки'
- tapOn: '[0-9]{1,2}:[0-9]{2}[\s\S]*(AM|PM)'
- tapOn:
    point: '63%, 38%'
- eraseText: 2
- inputText: '30'
- tapOn:
    point: '3%, 20%'
- takeScreenshot: artifacts/native-demo/film-12-receipt-edit
- tapOn: 'Сохранить'
- tapOn: 'Редактор'
- tapOn: 'Готово'
- tapOn: '[\s\S]*Елена Смирнова[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*Встречаемся в 18:30\?[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/film-13-edited-dialogue
- tapOn:
    point: '50%, 9%'
- assertVisible: '[\s\S]*elena_demo[\s\S]*'
- assertVisible: '[\s\S]*\+79990000003[\s\S]*'
- assertVisible: '[\s\S]*Виртуальный собеседник[\s\S]*'
- takeScreenshot: artifacts/native-demo/film-14-public-profile
- tapOn:
    point: '8%, 9%'
- tapOn:
    point: '8%, 9%'
- longPressOn:
    point: '27%, 6%'
- tapOn:
    id: 'simulator.section.1.row.2'
- tapOn:
    id: 'simulator.profile.field.3'
- eraseText
- inputText: '+79990000004'
- tapOn: 'Сохранить'
- tapOn: 'Готово'
- tapOn: '[\s\S]*Елена Смирнова[\s\S]*'
- tapOn:
    point: '50%, 9%'
- assertVisible: '[\s\S]*\+79990000004[\s\S]*'
- takeScreenshot: artifacts/native-demo/film-14b-phone-updated
- tapOn:
    point: '8%, 9%'
- tapOn:
    point: '8%, 9%'
- longPressOn:
    point: '27%, 6%'
- tapOn:
    id: 'simulator.section.2.row.2'
- tapOn: 'Статус собеседника'
- tapOn: 'Был.*недавно'
- tapOn: 'Редактор'
- tapOn: 'Готово'
- tapOn: '[\s\S]*Елена Смирнова[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*был\(а\) недавно[\s\S]*'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/film-15-recently
- tapOn:
    point: '8%, 9%'
- longPressOn:
    point: '27%, 6%'
- tapOn:
    id: 'simulator.section.2.row.2'
- tapOn: 'Статус собеседника'
- tapOn: 'Печатает…'
- tapOn: 'Редактор'
- tapOn: 'Готово'
- tapOn: '[\s\S]*Елена Смирнова[\s\S]*'
- extendedWaitUntil:
    visible: 'Открыть профиль'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/film-16-typing
- takeScreenshot: artifacts/native-demo/film-17-typing-motion
- runFlow: qa-root.yaml
- tapOn: '[\s\S]*Елена Смирнова[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*Встречаемся в 18:30\?[\s\S]*'
    timeout: 15000
- assertVisible: '[\s\S]*Да, договорились![\s\S]*'
- takeScreenshot: artifacts/native-demo/film-18-after-restart
- tapOn:
    point: '8%, 9%'
- tapOn: '[\s\S]*Анна Миронова[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*Привет! Прототип уже работает\.[\s\S]*'
    timeout: 15000
- assertNotVisible: '[\s\S]*Привет! Показываю прототип\.[\s\S]*'
- takeScreenshot: artifacts/native-demo/film-19-public-edit-persisted
# Technical acceptance after the presentation's final public frame:
# read the document-backed editor, independently of Postbox's edit overlay.
- tapOn:
    point: '8%, 9%'
- longPressOn:
    point: '27%, 6%'
- tapOn:
    id: 'simulator.section.2.row.0'
- assertVisible: '[\s\S]*Привет! Прототип уже работает\.[\s\S]*'
- assertNotVisible: '[\s\S]*Привет! Показываю прототип\.[\s\S]*'
- takeScreenshot: artifacts/native-demo/acceptance-public-edit-document
