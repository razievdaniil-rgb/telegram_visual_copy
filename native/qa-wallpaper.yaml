appId: org.chatstudio.localsimulator
---
# First pass: inspect the original controls before recording the full change flow.
- runFlow: qa-root.yaml
- takeScreenshot: artifacts/native-demo/wallpaper-gear-default
- tapOn: '[\s\S]*Анна Миронова[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*Сообщение за прошлый день[\s\S]*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/wallpaper-default-pattern
- runFlow: qa-root.yaml
- tapOn:
    point: '88%, 94%'
- extendedWaitUntil:
    visible: 'Мой профиль'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Оформление'
    direction: DOWN
    timeout: 20000
- tapOn: 'Оформление'
- extendedWaitUntil:
    visible: 'Обои для чатов'
    timeout: 20000
- takeScreenshot: artifacts/native-demo/wallpaper-appearance
- tapOn: 'Обои для чатов'
- extendedWaitUntil:
    visible: 'Выбрать из галереи'
    timeout: 20000
- takeScreenshot: artifacts/native-demo/wallpaper-catalog
