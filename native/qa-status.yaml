appId: org.chatstudio.localsimulator
---
- runFlow: qa-root.yaml
- longPressOn:
    point: '27%, 6%'
- extendedWaitUntil:
    visible: 'Редактор'
    timeout: 10000
- tapOn:
    id: 'simulator.section.2.row.0'
- tapOn: 'Статус собеседника'
- tapOn: 'Был.*недавно'
- tapOn: 'Редактор'
- tapOn: 'Готово'
- tapOn: '[\s\S]*Анна[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*был\(а\) недавно[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/recently
- runFlow: qa-root.yaml
- longPressOn:
    point: '27%, 6%'
- extendedWaitUntil:
    visible: 'Редактор'
    timeout: 10000
- tapOn:
    id: 'simulator.section.2.row.0'
- tapOn: 'Статус собеседника'
- tapOn: 'Печатает…'
- tapOn: 'Редактор'
- tapOn: 'Готово'
- tapOn: '[\s\S]*Анна[\s\S]*'
- extendedWaitUntil:
    # Original animated typing text is not exposed in Telegram's AX tree.
    # The header proves navigation; verify typing text/dots in the saved frames.
    visible: 'Открыть профиль'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/typing
