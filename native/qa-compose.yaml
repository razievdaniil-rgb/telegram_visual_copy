appId: org.chatstudio.localsimulator
---
- runFlow: qa-root.yaml
- tapOn: '[\s\S]*Анна[\s\S]*'
- tapOn:
    point: '45%, 95%'
- tapOn:
    text: 'Continue|Продолжить'
    optional: true
- inputText: 'QA public composer send'
- takeScreenshot: artifacts/native-demo/public-keyboard
- tapOn: 'Отправить'
- extendedWaitUntil:
    visible: '[\s\S]*QA public composer send[\s\S]*'
    timeout: 15000
- extendedWaitUntil:
    # The hidden Send node stays in AX at 1x1; check the restored voice action.
    visible: 'Голосовое сообщение'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/public-sent-message
- longPressOn: '[\s\S]*QA public composer send[\s\S]*'
- extendedWaitUntil:
    visible: 'Скопировать|Копировать|Copy'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/public-message-menu
- assertNotVisible: '[\s\S]*Чтобы копировать[\s\S]*'
- assertNotVisible: '[\s\S]*Hold a word[\s\S]*'
- tapOn: 'Скопировать|Копировать|Copy'
- longPressOn: '[\s\S]*QA public composer send[\s\S]*'
- extendedWaitUntil:
    visible: 'Выбрать|Select'
    timeout: 10000
- assertNotVisible: '[\s\S]*Чтобы копировать[\s\S]*'
- tapOn: 'Выбрать|Select'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/public-message-selected
- runFlow: qa-root.yaml
- tapOn: '[\s\S]*Анна[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*QA public composer send[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/public-send-after-restart
