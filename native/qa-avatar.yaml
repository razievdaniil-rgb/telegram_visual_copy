appId: org.chatstudio.localsimulator
---
- runFlow: qa-root.yaml
- takeScreenshot: artifacts/native-demo/avatar-before-chats
- tapOn: '[\s\S]*Анна[\s\S]*'
- tapOn:
    point: '50%, 9%'
- extendedWaitUntil:
    visible: '[\s\S]*demo_anna[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/avatar-before-profile
- runFlow: qa-root.yaml
- longPressOn:
    point: '27%, 6%'
- extendedWaitUntil:
    visible: 'Редактор'
    timeout: 10000
- tapOn:
    id: 'simulator.section.1.row.0'
- tapOn: 'Выбрать аватар'
- tapOn:
    text: 'Allow Full Access|Allow Access to All Photos|Разрешить полный доступ|Разрешить доступ ко всем фото'
    optional: true
- tapOn:
    text: 'Recents|Недавние'
    optional: true
- takeScreenshot: artifacts/native-demo/photo-library
- tapOn:
    point: '16%, 28%'
- takeScreenshot: artifacts/native-demo/photo-crop
- tapOn:
    # The crop button is visible but absent from this simulator's AX tree.
    point: '90%, 92%'
- extendedWaitUntil:
    visible: 'Сохранить'
    timeout: 10000
- tapOn: 'Сохранить'
- tapOn: 'Готово'
- takeScreenshot: artifacts/native-demo/avatar-replaced-chats
- tapOn: '[\s\S]*Анна[\s\S]*'
- tapOn:
    point: '50%, 9%'
- assertVisible: '[\s\S]*demo_anna[\s\S]*'
- takeScreenshot: artifacts/native-demo/uploaded-avatar-profile
- runFlow: qa-root.yaml
- takeScreenshot: artifacts/native-demo/avatar-replaced-chats-after-restart
- tapOn: '[\s\S]*Анна[\s\S]*'
- tapOn:
    point: '50%, 9%'
- extendedWaitUntil:
    visible: '[\s\S]*demo_anna[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/uploaded-avatar-after-restart
