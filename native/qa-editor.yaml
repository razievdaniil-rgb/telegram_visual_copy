appId: org.chatstudio.localsimulator
---
- runFlow: qa-root.yaml
- longPressOn:
    point: '27%, 6%'
- extendedWaitUntil:
    visible: 'Редактор'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/editor
- tapOn:
    id: 'simulator.section.1.row.0'
- takeScreenshot: artifacts/native-demo/editor-profile
- tapOn:
    id: 'simulator.profile.field.3'
- eraseText
- inputText: '+70000000002'
- tapOn: 'Сохранить'
- assertVisible: 'Редактор'
- tapOn: 'Добавить собеседника'
- tapOn:
    id: 'simulator.profile.field.0'
- inputText: 'QA Alex'
- tapOn:
    id: 'simulator.profile.field.1'
- inputText: 'Example'
- tapOn:
    id: 'simulator.profile.field.2'
- inputText: 'qa_example'
- tapOn:
    id: 'simulator.profile.field.3'
- inputText: '+70000000003'
- tapOn:
    id: 'simulator.profile.field.4'
- inputText: 'Local test profile'
- tapOn: 'Сохранить'
- assertVisible: '[\s\S]*QA Alex[\s\S]*'
- tapOn: 'Создать чат'
- tapOn: '[\s\S]*QA Alex[\s\S]*'
- takeScreenshot: artifacts/native-demo/editor-created-chat
- tapOn:
    id: 'simulator.section.2.row.2'
- tapOn: 'Сообщение'
- tapOn: 'Текст сообщения'
- inputText: 'QA new contact'
- tapOn: 'Сохранить'
- tapOn: 'Редактор'
- tapOn: 'Готово'
- tapOn: '[\s\S]*QA Alex[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*QA new contact[\s\S]*'
    timeout: 15000
- tapOn:
    point: '50%, 9%'
- extendedWaitUntil:
    visible: '[\s\S]*qa_example[\s\S]*'
    timeout: 15000
- assertVisible: '[\s\S]*\+70000000003[\s\S]*'
- assertVisible: '[\s\S]*Local test profile[\s\S]*'
- takeScreenshot: artifacts/native-demo/created-public-profile
