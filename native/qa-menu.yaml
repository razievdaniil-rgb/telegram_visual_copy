appId: org.chatstudio.localsimulator
---
- runFlow: qa-root.yaml
# Original Texture folder labels are drawn, but absent from the AX tree.
# Inspect these screenshots; use the visible tab coordinates after collapse.
- takeScreenshot: artifacts/native-demo/menu-collapsed
- swipe:
    start: '50%, 34%'
    end: '50%, 70%'
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/menu-expanded-stories
- swipe:
    start: '50%, 70%'
    end: '50%, 33%'
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/menu-recollapsed-before-search
# Four native tabs now occupy the full capsule; no separate search button.
- tapOn:
    point: '88%, 94%'
- extendedWaitUntil:
    visible: '[\s\S]*Даниил[\s\S]*'
    timeout: 30000
- takeScreenshot: artifacts/native-demo/settings-owner-profile
- tapOn:
    point: '62%, 94%'
- extendedWaitUntil:
    visible: '[\s\S]*Миронова[\s\S]*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/menu-settings-closed
- tapOn:
    point: '65%, 13%'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '[\s\S]*Миронова[\s\S]*'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/menu-work-folder
- tapOn:
    point: '15%, 13%'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/menu-restored
# Verify the original gear path in the exact same binary, then restore default avatar.
- launchApp:
    arguments:
      TelegramSimulator.settingsTabAvatar: false
- extendedWaitUntil:
    visible: '[\s\S]*Михаил[\s\S]*'
    timeout: 60000
- takeScreenshot: artifacts/native-demo/menu-gear-fallback
- tapOn:
    point: '88%, 94%'
- extendedWaitUntil:
    visible: '[\s\S]*Даниил[\s\S]*'
    timeout: 30000
- takeScreenshot: artifacts/native-demo/settings-gear-fallback
- launchApp:
    arguments:
      TelegramSimulator.settingsTabAvatar: true
- extendedWaitUntil:
    visible: '[\s\S]*Михаил[\s\S]*'
    timeout: 60000
- takeScreenshot: artifacts/native-demo/menu-avatar-restored
