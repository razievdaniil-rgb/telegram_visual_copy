appId: org.chatstudio.localsimulator
---
- runFlow: qa-root.yaml
- extendedWaitUntil:
    visible: '[\s\S]*WORK[\s\S]*'
    timeout: 15000
- assertVisible: '[\s\S]*Группы[\s\S]*'
- assertVisible: '[\s\S]*Боты[\s\S]*'
- takeScreenshot: artifacts/native-demo/menu-collapsed
- swipe:
    start: '50%, 34%'
    end: '50%, 70%'
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/native-demo/menu-expanded-stories
- swipe:
    start: '50%, 70%'
    end: '50%, 33%'
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: '92%, 94%'
- takeScreenshot: artifacts/native-demo/menu-search-open
- tapOn:
    text: 'Continue|Продолжить'
    optional: true
- inputText: 'Анна'
- extendedWaitUntil:
    visible: '[\s\S]*Миронова[\s\S]*'
    timeout: 15000
- takeScreenshot: artifacts/native-demo/menu-search-results
- tapOn: 'Отмена'
- tapOn: '[\s\S]*WORK[\s\S]*'
- extendedWaitUntil:
    visible: '[\s\S]*Миронова[\s\S]*'
    timeout: 10000
- takeScreenshot: artifacts/native-demo/menu-work-folder
- tapOn: '[\s\S]*Все чаты[\s\S]*'
- takeScreenshot: artifacts/native-demo/menu-restored
